name: Receiver Build

on:
  push:
    branches: [ main, feature/battery-emulator-migration ]
  pull_request:
    branches: [ main, feature/battery-emulator-migration ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Build Receiver (TFT Display)
      run: pio run -e lilygo-t-display-s3_tft -j 12
      working-directory: ${{ github.workspace }}
