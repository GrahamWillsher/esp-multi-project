name: Common Library Validation

on:
  push:
    branches: [ main, feature/battery-emulator-migration ]
  pull_request:
    branches: [ main, feature/battery-emulator-migration ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: Validate documentation
      run: |
        echo "Validating common library structure..."
        find . -name "*.md" -type f | head -10
