name: Hardening Guardrails

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run hardening guardrail checks
        run: python ESP32common/scripts/hardening_guardrails.py --root "$GITHUB_WORKSPACE"
