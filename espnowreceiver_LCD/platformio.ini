[platformio]
default_envs = waveshare_esp32s3_lcd7_lvgl

[env:waveshare_esp32s3_lcd7_lvgl]
platform = espressif32@6.5.0
board = waveshare_esp32s3_n16r8
framework = arduino
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
upload_flags =
    --before
    default_reset
    --after
    hard_reset
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb_ota.csv
board_build.filesystem = littlefs

; Shared library path (channel_manager, connection_manager, firmware_metadata, etc.)
lib_extra_dirs = ../esp32common

; Generates dynamic build-time metadata (DEVICE_HARDWARE, PIO_ENV_NAME, BUILD_DATE)
; and renames firmware binary with version suffix when FW_VERSION_* flags are set.
extra_scripts = pre:../esp32common/scripts/version_firmware.py

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -I ../esp32common
    -Iinclude
    -DLV_CONF_PATH=lv_conf.h
    -DFW_VERSION_MAJOR=2
    -DFW_VERSION_MINOR=0
    -DFW_VERSION_PATCH=0
    -DLOG_USE_MQTT=0
    -DLOG_SERIAL_FORMAT_TRANSMITTER=1
    -DTARGET_DEVICE=RECEIVER
    -DRECEIVER_DEVICE
    -DRADIO_PRESSURE_CRITICAL_NO_MEM_THRESHOLD=3
    -DRXCONN_NO_MEM_TRIGGER_THRESHOLD=20

lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8

build_src_filter =
    +<*>
    -<espnow/espnow_runtime*.cpp>
